steps:
  - name: 'eclipse-temurin:17-jdk'
    entrypoint: 'bash'
    args: ['-c', 'chmod +x mvnw && ./mvnw -B -q clean package -DskipTests']

  - name: 'gcr.io/cloud-builders/gsutil'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        WAR_FILE=$(find target -maxdepth 1 -name '*.war' | head -n1)
        gsutil cp "$$WAR_FILE" "gs://${_ARTIFACT_BUCKET}/builds/petclinic-${BUILD_ID}.war"
        gsutil cp "$$WAR_FILE" "gs://${_ARTIFACT_BUCKET}/latest/petclinic-latest.war"

substitutions:
  _ARTIFACT_BUCKET: npc-bucket-nova
